<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#13203d"/>
      <stop offset="100%" stop-color="#060912"/>
    </linearGradient>
    <linearGradient id="rubber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <g transform="rotate(-38 30 30)">
    <!-- Paddle handle -->
    <rect x="25.5" y="42" width="9" height="19" rx="3.5" fill="url(#handle)" stroke="#fde68a" stroke-width="1"/>
    <!-- Blade edge & rubber face -->
    <ellipse cx="30" cy="25" rx="18" ry="19.5" fill="#fde68a"/>
    <ellipse cx="30" cy="24.5" rx="16.5" ry="18" fill="url(#rubber)"/>
    <!-- Subtle shine -->
    <path d="M20 14 C23 10, 31 9, 36 12" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- Ping pong ball -->
  <circle cx="49" cy="18" r="7" fill="#ffffff" stroke="#fde68a" stroke-width="1.2"/>
  <circle cx="47" cy="16" r="2" fill="rgba(251,191,36,0.45)"/>
</svg>
